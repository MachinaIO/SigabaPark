# The gate (docs/GITHUB_PLATFORM.md in the core, "Workflows"). It always runs the base branch's
# copy of this file (`pull_request_target`), and never runs a pull request's code outside the
# sandbox:
#
#   precheck  reads the pull request's added files through the API, as data (no checkout of it);
#   verify    builds them in a container without network, token or secrets, where Lean runs as an
#             unprivileged user apart from the verifier;
#   decide    runs no pull request code, and accepts `verify`'s schema-checked result only if it
#             is about this commit and environment and covers exactly the added nodes; read only;
#   report    comments the decision and sets the gate's labels, with the workflow's own token
#             (pull_request_target only);
#   merge     enables auto-merge for a passing pull request of an `automerge` author, with the
#             gate's GitHub App token (in the `gate` Environment, which only `main` may use). It
#             must not be the workflow's own token: GitHub starts no workflow for what that token
#             does, so the merge queue's own run of this gate would never start.
# Neither report nor merge runs pull request code; both read only `decide`'s decision.
#
# Draft pull requests are not checked (docs/RESEARCH_PROTOCOL.md in the core, D1): agents open
# them early and push to them while they work. Every job is skipped while a pull request is a
# draft; marking it ready (`ready_for_review`) runs the gate on its head, and so does every push
# while it is ready. Turning it back into a draft (`converted_to_draft`) only runs `unqueue`, which
# disables its auto-merge and takes it out of the merge queue. GitHub never merges a draft, and
# the merge queue runs the full gate again on the merged candidate.
#
# Nothing closes a pull request: a decision is about one commit, and a newer commit gets its
# own run. Require the check the gate's `decide` (from the GitHub Actions app) in the ruleset of `main`, with
# the merge queue.
name: gate

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  merge_group:
    types: [checks_requested]

permissions: {}

concurrency:
  group: gate-${{ github.event.pull_request.number || github.event.merge_group.head_ref }}
  cancel-in-progress: true

jobs:
  precheck:
    # Merge groups always; pull requests only when they are ready for review.
    if: >-
      github.event_name == 'merge_group' ||
      (github.event.action != 'converted_to_draft' && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ok: ${{ steps.precheck.outputs.ok }}
      env_id: ${{ steps.env.outputs.env_id }}
      image: ${{ steps.env.outputs.image }}
      core_repo: ${{ steps.env.outputs.core_repo }}
      core_rev: ${{ steps.env.outputs.core_rev }}
      author: ${{ steps.who.outputs.author }}
      pr: ${{ steps.who.outputs.pr }}
      revision: ${{ steps.precheck.outputs.revision }}
      learning: ${{ steps.kind.outputs.learning }}
    steps:
      - name: Check out the base branch (never the pull request)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
      - name: Read the default environment
        id: env
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          e = next(e for e in json.load(open("base/env/environments.json"))["environments"]
                   if e["state"] == "default")
          repo = re.sub(r"^https://github\.com/|\.git$", "", e["core_url"])
          assert re.fullmatch(r"[\w.-]+/[\w.-]+", repo) and re.fullmatch(r"[\w./-]+", e["core"])
          assert re.fullmatch(r"[\w./:-]+@sha256:[0-9a-f]{64}", e["image"]), "pin the image by digest"
          print(f"env_id={e['id']}\nimage={e['image']}\ncore_repo={repo}\ncore_rev={e['core']}")
          PY
      - name: Check out the core's tools at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.env.outputs.core_repo }}
          ref: ${{ steps.env.outputs.core_rev }}
          path: core
          persist-credentials: false
      - name: The author
        id: who
        env:
          GH_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_REF: ${{ github.event.merge_group.head_ref }}
        run: |
          if [ -n "$PR_NUMBER" ]; then
            echo "author=$PR_AUTHOR" >> "$GITHUB_OUTPUT"
            echo "pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"
          else
            n=$(printf '%s' "$HEAD_REF" | sed -nE 's#^.*/pr-([0-9]+)-[0-9a-f]+$#\1#p')
            [ -n "$n" ] || { echo "cannot read the pull request of $HEAD_REF"; exit 1; }
            author=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$n" --jq .user.login)
            echo "author=$author" >> "$GITHUB_OUTPUT"
            echo "pr=$n" >> "$GITHUB_OUTPUT"
          fi
      - name: The author's permission on the repository
        id: perm
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ steps.who.outputs.author }}
        # For meta/trusted.json's `collaborators` mode. GitHub reports admin, write, read or none;
        # a user who is not a collaborator gets 404, which is `none`. Any other failure fails
        # the job, so the gate never decides on a permission it could not read.
        run: |
          if out=$(gh api "repos/$GITHUB_REPOSITORY/collaborators/$AUTHOR/permission" --jq .permission 2>err.txt); then
            echo "permission=$out" >> "$GITHUB_OUTPUT"
          elif grep -q "HTTP 404" err.txt; then
            echo "permission=none" >> "$GITHUB_OUTPUT"
          else
            cat err.txt; exit 1
          fi
      - name: Fetch the added files (as data)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # The event's commits, which do not move: the files, their modes and their contents are
          # read at HEAD_SHA, and everything after this step is about HEAD_SHA.
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          python3 core/python/dag_tools.py fetch --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA" \
            --head "$HEAD_SHA" --out fetched
      - name: Learning pull requests (checked by the learning workflow)
        id: kind
        # A pull request whose every changed path is under generators/ or notebooks/ is a
        # learning pull request: `learning-decide` checks it (ci/learning/), and this gate only
        # defers to it. Any other path keeps the gate's own precheck, which rejects everything
        # outside dag/ (so ci/, .github/, meta/ and env/ need an administrator's bypass).
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          if [ -f base/ci/learning/cli.py ]; then
            (cd base && python3 -m ci.learning.cli fetch --repo "$GITHUB_REPOSITORY" --base "$BASE_SHA" \
              --head "$HEAD_SHA" --out ../learning-fetched)
            EVENT="${{ github.event_name }}" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          L = ("generators/", "notebooks/")
          rows = json.load(open("learning-fetched/files.json"))["files"]
          learning = bool(rows) and all(r["filename"].startswith(L) for r in rows)
          print(f"learning={'true' if learning else 'false'}")
          # A merge group combines pull requests that each passed their checks: when it holds
          # both nodes and learning files (and nothing else), the gate checks the nodes and
          # `learning-decide` the learning files, so the latter leave this precheck's listing.
          if os.environ["EVENT"] == "merge_group" and not learning and \
                  all(r["filename"].startswith(L + ("dag/",)) for r in rows):
              f = json.load(open("fetched/files.json"))
              f["files"] = [r for r in f["files"] if not r["filename"].startswith(L)]
              json.dump(f, open("fetched/files.json", "w"), indent=1)
          PY
          else
            echo "learning=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Precheck
        id: precheck
        if: steps.kind.outputs.learning != 'true'
        env:
          AUTHOR: ${{ steps.who.outputs.author }}
          PERMISSION: ${{ steps.perm.outputs.permission }}
        run: python3 core/python/dag_tools.py precheck --dag base --fetched fetched --author "$AUTHOR" --permission "$PERMISSION" --out fetched/precheck.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fetched
          path: fetched
          retention-days: 14

  verify:
    needs: precheck
    if: needs.precheck.outputs.ok == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GitHub-hosted maximum; a pull request may register many nodes
    permissions:
      contents: read
    steps:
      - name: Check out the base branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          path: base
          persist-credentials: false
      - name: Check out the records (hints only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          ref: records
          path: records
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: fetched
          path: fetched
      - name: Verify in the sandbox
        env:
          IMAGE: ${{ needs.precheck.outputs.image }}
          ENV_ID: ${{ needs.precheck.outputs.env_id }}
          REVISION: ${{ needs.precheck.outputs.revision }}
        run: |
          mkdir -p out records fetched/files
          docker pull "$IMAGE"
          # The verifier runs as root with no capability but changing its user; every Lean and
          # Lake process runs as uid 1000, which cannot touch the sources, the verifier or its
          # output. The result is the verifier's standard output; its exit status is recorded
          # here, outside the container.
          set +e
          docker run --rm --network none --read-only --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --security-opt no-new-privileges \
            --user 0:0 -e SIGABA_LEAN_UID=1000 \
            --memory 14g --cpus 4 --pids-limit 4096 \
            --tmpfs /work:rw,exec,size=10g,mode=1777 --tmpfs /tmp:rw,exec,size=2g,mode=1777 \
            -v "$PWD/base:/base:ro" -v "$PWD/fetched/files:/new:ro" -v "$PWD/records:/records:ro" \
            "$IMAGE" verify --dag /base --new /new --out - --env "$ENV_ID" --revision "$REVISION" \
              --records /records --workdir /work/ws > out/result.json 2> out/log.txt
          echo $? > out/exit
          tail -c 20000 out/log.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: result
          path: out/
          if-no-files-found: ignore
          retention-days: 90

  decide:
    needs: [precheck, verify]
    if: always() && needs.precheck.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      automerge: ${{ steps.decision.outputs.automerge }}
    steps:
      - name: Check out the core's tools at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.precheck.outputs.core_repo }}
          ref: ${{ needs.precheck.outputs.core_rev }}
          path: core
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: fetched
          path: fetched
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        continue-on-error: true
        with:
          name: result
          path: result
      - name: Decide
        id: decision
        env:
          AUTHOR: ${{ needs.precheck.outputs.author }}
          EVENT: ${{ github.event_name }}
          ENV_ID: ${{ needs.precheck.outputs.env_id }}
          REVISION: ${{ needs.precheck.outputs.revision }}
          LEARNING: ${{ needs.precheck.outputs.learning }}
        run: |
          mkdir -p fetched result
          if [ "$LEARNING" = true ]; then
            echo '{"conclusion": "success", "automerge": false, "labels": [], "comment": "Learning pull request: checked by `learning-decide`."}' > decision.json
          else
          [ -f fetched/precheck.json ] || echo '{"ok": false, "accepted": true, "automerge": false, "problems": ["the precheck did not finish"], "added": []}' > fetched/precheck.json
          python3 core/python/dag_tools.py decide --precheck fetched/precheck.json \
            --result result/result.json --exit-code result/exit --env "$ENV_ID" \
            --revision "$REVISION" --author "$AUTHOR" --event "$EVENT" --out decision.json || true
          fi
          python3 - <<'PY'
          import json
          d = json.load(open("decision.json"))
          open("comment.md", "w").write(d["comment"][:60000])
          # Every line ends in a newline: `read` fails on a last line without one.
          open("labels.txt", "w").write("".join(f"{l}\n" for l in d["labels"]))
          open("flags.txt", "w").write(f"{d['conclusion']} {int(d['automerge'])}\n")
          PY
          read -r conclusion automerge < flags.txt
          echo "automerge=$automerge" >> "${GITHUB_OUTPUT:-/dev/null}"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: decision
          path: |
            decision.json
            comment.md
            labels.txt
            flags.txt
          retention-days: 14
      - name: Conclusion
        run: |
          read -r conclusion automerge < flags.txt
          [ "$conclusion" = success ]

  # Write access, for pull requests only (a merge group has nothing to report on). The token is the
  # workflow's own, which expires with the job. This job runs no pull request code: it reads
  # `decide`'s decision and the core's tools at the pinned revision.
  report:
    needs: [precheck, decide]
    if: >-
      always() && github.event_name == 'pull_request_target' &&
      needs.precheck.result != 'skipped' && needs.precheck.outputs.pr != '' &&
      needs.precheck.outputs.learning != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pull-requests: write   # comment, label
      issues: write          # create and set labels
    steps:
      - name: Check out the core's tools at the pinned revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ needs.precheck.outputs.core_repo }}
          ref: ${{ needs.precheck.outputs.core_rev }}
          path: core
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: decision
          path: .
      - name: Report on the pull request
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.precheck.outputs.pr }}
          REVISION: ${{ needs.precheck.outputs.revision }}
        run: |
          read -r conclusion automerge < flags.txt
          gh pr comment "$PR" -R "$GITHUB_REPOSITORY" --body-file comment.md
          # The gate's labels follow the latest decision (others are left alone); a missing label
          # is created, and a failure to label is a failure of this step, never silent.
          current=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json labels --jq '[.labels[].name]')
          python3 core/python/dag_tools.py labels --decision decision.json --current "$current" \
            > label-ops.txt
          while read -r op label; do
            if [ "$op" = add ]; then
              gh label create "$label" -R "$GITHUB_REPOSITORY" --force >/dev/null
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --add-label "$label"
            elif [ "$op" = remove ]; then
              gh pr edit "$PR" -R "$GITHUB_REPOSITORY" --remove-label "$label"
            fi
          done < label-ops.txt

  # Puts a passing pull request of an `automerge` author into the merge queue. The App's token is
  # needed: GitHub starts no workflow for an event caused by the workflow's own token, so a pull
  # request queued with it would wait for this gate's merge group run forever.
  merge:
    needs: [precheck, decide]
    if: github.event_name == 'pull_request_target' && needs.decide.outputs.automerge == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gate
    permissions: {}
    steps:
      - name: A token of the gate's GitHub App
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_KEY }}
      - name: Enable auto-merge for the verified commit
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ needs.precheck.outputs.pr }}
          REVISION: ${{ needs.precheck.outputs.revision }}
        # Only the verified commit of a pull request that is still ready: if it has moved on or
        # become a draft again, nothing is merged.
        run: |
          state=$(gh pr view "$PR" -R "$GITHUB_REPOSITORY" --json isDraft,headRefOid \
            --jq '"\(.isDraft) \(.headRefOid)"')
          if [ "$state" != "false $REVISION" ]; then
            echo "not merging: the pull request is now ($state), the gate checked $REVISION"
            exit 0
          fi
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --auto --squash --match-head-commit "$REVISION"

  # A ready pull request turned back into a draft leaves the merge queue and loses its auto-merge,
  # with the gate's App token (the workflow's own token cannot change the merge queue). It runs no
  # pull request code and has no checkout.
  unqueue:
    if: github.event_name == 'pull_request_target' && github.event.action == 'converted_to_draft'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: gate
    permissions: {}
    steps:
      - name: A token of the gate's GitHub App
        id: app
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_KEY }}
      - name: Disable auto-merge and leave the merge queue
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PR: ${{ github.event.pull_request.number }}
          NODE: ${{ github.event.pull_request.node_id }}
        # Both are no-ops (reported, not failed) when the pull request had neither.
        run: |
          gh pr merge "$PR" -R "$GITHUB_REPOSITORY" --disable-auto || echo "auto-merge was not enabled"
          gh api graphql -f query='mutation($id: ID!) { dequeuePullRequest(input: {id: $id}) { clientMutationId } }' \
            -f id="$NODE" || echo "the pull request was not in the merge queue"
