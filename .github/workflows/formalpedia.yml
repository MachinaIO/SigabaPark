# Opens a pull request with Formalpedia's new items (Prove2Me's daily export) as DAG files. They go
# through the gate like any other pull request; list the App's bot login in meta/trusted.json.
name: formalpedia

on:
  schedule:
    - cron: "0 5 * * 2"
  workflow_dispatch:
    inputs:
      match:
        description: "only paths matching this regular expression"
        required: false
      limit:
        description: "at most this many definitions and theorems"
        required: false
        default: "50"

permissions: {}

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: gate
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          path: dag
          persist-credentials: false
      - name: Read the default environment
        id: env
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          e = next(e for e in json.load(open("dag/env/environments.json"))["environments"]
                   if e["state"] == "default")
          print(f"core_repo={re.sub(r'^https://github.com/|[.]git$', '', e['core_url'])}\ncore_rev={e['core']}")
          PY
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.env.outputs.core_repo }}
          ref: ${{ steps.env.outputs.core_rev }}
          path: core
          persist-credentials: false
      - name: Convert
        id: convert
        env:
          MATCH: ${{ inputs.match }}
          LIMIT: ${{ inputs.limit || '50' }}
        run: |
          python3 core/python/dag_tools.py formalpedia --dag dag --out new --mirror mirror \
            --limit "$LIMIT" ${MATCH:+--match "$MATCH"}
          [ -d new/dag ] && echo "files=1" >> "$GITHUB_OUTPUT" || true
      - id: app
        if: steps.convert.outputs.files == '1'
        uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        with:
          app-id: ${{ vars.GATE_APP_ID }}
          private-key: ${{ secrets.GATE_APP_KEY }}
      - name: Open the pull request
        if: steps.convert.outputs.files == '1'
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          branch="formalpedia/$(date -u +%Y%m%d-%H%M%S)"
          cd dag
          git checkout -q -b "$branch"
          cp -r ../new/dag/. dag/
          git config user.name "dag-formalpedia" && git config user.email "dag-formalpedia@users.noreply.github.com"
          git add dag && git commit -q -m "Formalpedia: new items"
          git push -q "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          gh pr create -R "$GITHUB_REPOSITORY" --head "$branch" --title "Formalpedia: new items" \
            --body "Items of Formalpedia not yet in the DAG. The gate checks each in this environment."
