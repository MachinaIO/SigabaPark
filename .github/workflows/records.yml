# Appends the verification records of what lands on `main` to the `records` branch
# (docs/GITHUB_PLATFORM.md in the core, "Environments"). For each recent commit of `main` not yet
# recorded, it reads the result the merge queue's `gate` run produced for it, checks its shape, and
# runs no Lean.
#
# It runs on push to `main`, and every 10 minutes in case a merge did not trigger the push (a merge
# made with the workflow's own token triggers no workflow). Appending is idempotent, so a commit
# seen by both runs is recorded once. When it records something, it starts `index`.
name: records

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

# One writer of the records branch at a time, shared with reverify.yml; every waiting writer is
# kept (`queue: max`), none replaced by a newer one.
concurrency:
  group: records-branch
  cancel-in-progress: false
  queue: max

jobs:
  records:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write        # push the records branch
      actions: write         # read the gate's results; start `index`
      pull-requests: read
    steps:
      - name: Check out main
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: main
          path: dag
          persist-credentials: false
      - name: Check out the records (to see which commits are recorded)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        continue-on-error: true
        with:
          ref: records
          path: seen
          persist-credentials: false
      - name: Read the default environment
        id: env
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, re
          e = next(e for e in json.load(open("dag/env/environments.json"))["environments"]
                   if e["state"] == "default")
          print(f"core_repo={re.sub(r'^https://github.com/|[.]git$', '', e['core_url'])}\ncore_rev={e['core']}\nenv_id={e['id']}")
          PY
      - name: Check out the core's tools
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ steps.env.outputs.core_repo }}
          ref: ${{ steps.env.outputs.core_rev }}
          path: core
          persist-credentials: false
      - name: Find the merge queue's verifications of recent commits
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p seen results
          # Commits already recorded (records name their commit).
          cat seen/*.jsonl 2>/dev/null | python3 -c '
          import json, sys
          print("\n".join(sorted({json.loads(l).get("commit") or "" for l in sys.stdin if l.strip()})))
          ' > recorded.txt
          # The recent commits of main, oldest first.
          gh api "repos/$GITHUB_REPOSITORY/commits?sha=main&per_page=30" --jq '.[].sha' | tac > commits.txt
          bad=0
          while read -r sha; do
            grep -qx "$sha" recorded.txt && continue
            run=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$sha&event=merge_group" \
              --jq '[.workflow_runs[] | select(.name == "gate" and .conclusion == "success")][0].id // empty')
            [ -n "$run" ] || continue        # not from the merge queue (a maintainer's change)
            gh run download "$run" -R "$GITHUB_REPOSITORY" -n result -D "results/$sha" || { bad=1; continue; }
            if [ "$(cat "results/$sha/exit")" != 0 ]; then
              echo "::error::the verification of $sha did not pass"; rm -rf "results/$sha"; bad=1; continue
            fi
            gh api "repos/$GITHUB_REPOSITORY/commits/$sha/pulls" \
              --jq '(.[0].number // "" | tostring) + " " + (.[0].user.login // "")' > "results/$sha/pr"
            echo "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$run" > "results/$sha/run"
            echo "$sha" >> todo.txt
          done < commits.txt
          [ -s todo.txt ] && echo "found=1" >> "$GITHUB_OUTPUT"
          echo "bad=$bad" >> "$GITHUB_OUTPUT"
      - name: Append the records
        id: append
        if: steps.find.outputs.found == '1'
        env:
          GH_TOKEN: ${{ github.token }}
          ENV_ID: ${{ steps.env.outputs.env_id }}
        run: |
          url="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git config --global user.name "dag-records"
          git config --global user.email "dag-records@users.noreply.github.com"
          # Append to the latest tip, and start again from it if another writer pushed first
          # (appending is idempotent).
          for attempt in 1 2 3 4 5; do
            rm -rf records
            if ! git clone -q --branch records --single-branch "$url" records; then
              git init -q -b records records && git -C records remote add origin "$url"
            fi
            while read -r sha; do
              read -r pr author < "results/$sha/pr" || true
              python3 core/python/dag_tools.py records --result "results/$sha/result.json" \
                --records records --env "$ENV_ID" --commit "$sha" --run "$(cat "results/$sha/run")" \
                ${pr:+--pr "$pr"} ${author:+--author "$author"}
            done < todo.txt
            git -C records add -A
            git -C records diff --cached --quiet && exit 0
            git -C records commit -q -m "records for $(wc -l < todo.txt) commit(s) of main"
            if git -C records push -q origin records; then
              echo "pushed=1" >> "$GITHUB_OUTPUT"; exit 0
            fi
            sleep $((attempt * 5))
          done
          echo "could not publish the records"; exit 1
      - name: Update the index
        if: steps.append.outputs.pushed == '1'
        env:
          GH_TOKEN: ${{ github.token }}
        # A push with the workflow's token triggers no workflow; a dispatch does.
        run: gh workflow run index.yml -R "$GITHUB_REPOSITORY" --ref main
      - name: Every verification found was usable
        if: steps.find.outputs.bad == '1'
        run: exit 1
